# The experiments/ tree is a model zoo containing vendored third-party code
# (e.g. molformer, regression_transformer) that is not style-managed here and
# includes files that ruff cannot even parse. Hooks are enforced on the
# maintained code only: the boom/ package, the reproduce/ pipeline and tests/.
exclude: '^experiments/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
